<!DOCTYPE html>
<html lang="en">
<head>
	<title>Simon Game</title>
	<link rel="stylesheet" href="simon.css">
</head>
<body>
<h2 id="heading">Simon Game</h2>
<h3 id="level"> Press Any Key to Start!</h3>
<div class="container" >
<div class="lineOne">
<div class="first box" type="button" id="first"> 1</div>
<div class="second box" type="button" id="second"> 2</div>
</div>
<div class="lineTwo">
<div class="third box" type="button" id="third"> 3</div>
<div class="fourth box" type="button" id="fourth"> 4</div>
</div>
</div>
<script src="simon.js"></script>
</body>
</html>
